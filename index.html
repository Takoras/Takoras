<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <script src="/phone.js"></script>
    <meta name="theme-color" content="#0d0d12" />
    <title>Takoras – jeu gratuit de jetons en pixel art et duels</title>
    <!-- Ce que Google et les réseaux (Discord, Insta, WhatsApp…) affichent du site -->
    <meta name="description" content="Takoras, c'est un jeu gratuit dans le navigateur : ouvre des tirages, collectionne des jetons en pixel art dessinés à la main, du commun au mythique, puis affronte d'autres joueurs en duel classé dans le Ring." />
    <link rel="canonical" href="https://takoras.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Takoras" />
    <meta property="og:url" content="https://takoras.com/" />
    <meta property="og:title" content="Takoras – jeu gratuit de jetons en pixel art et duels" />
    <meta property="og:description" content="Ouvre des tirages, collectionne des jetons en pixel art et gagne des duels. Gratuit, dans le navigateur." />
    <meta property="og:image" content="https://takoras.com/img/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="fr_FR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Takoras – jeu gratuit de jetons en pixel art et duels" />
    <meta name="twitter:description" content="Ouvre des tirages, collectionne des jetons en pixel art et gagne des duels. Gratuit, dans le navigateur." />
    <meta name="twitter:image" content="https://takoras.com/img/og.png" />
    <!-- fiche « jeu vidéo » lisible par Google (données, pas un script exécuté) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "Takoras",
        "url": "https://takoras.com/",
        "image": "https://takoras.com/img/og.png",
        "description": "Jeu gratuit dans le navigateur : collection de jetons en pixel art et duels classés.",
        "genre": ["Collection", "Stratégie"],
        "gamePlatform": "Navigateur web",
        "applicationCategory": "Game",
        "inLanguage": ["fr", "en"],
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" }
      }
    </script>
    <link rel="icon" type="image/png" href="/img/logo.png" />
    <!-- ajouté à l'écran d'accueil : le site s'ouvre en plein écran, en paysage (seule façon d'avoir le plein écran sur iPhone) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/img/logo.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- connexion au serveur de jeu ouverte tout de suite (gagne ~100 ms sur la première requête) -->
    <link rel="preconnect" href="https://joyskjoofihwhycyreyn.supabase.co" crossorigin />
    <!-- Écran de chargement, dans la DA Takoras, affiché tout de suite (avant le JS) : bande pixel qui glisse en fond,
         « ? » qui tombent, le jeton Takoras qui sautille et se balance, le logo dessiné, une barre en blocs pixel qui se
         remplit. Quand le site est prêt, il s'efface en fondu (boot.tsx) au lieu d'être remplacé d'un coup. -->
    <link rel="preload" as="image" href="/img/tokens/takoras.png" />
    <link rel="preload" as="image" href="/img/logo-takoras.png?v=2" />
    <style>
      html, body { margin: 0; background: #0d0d12; color: #f2f2f5; }
      .boot { position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; overflow: hidden; background: #0d0d12;
        transition: opacity .45s cubic-bezier(.2,.8,.2,1), scale .45s cubic-bezier(.2,.8,.2,1); }
      .boot.out { opacity: 0; scale: 1.03; pointer-events: none; }
      /* bande pixel de fond (comme les fonds des jetons), elle glisse doucement */
      .boot-band { position: absolute; left: -10%; width: 120%; height: 64px; background: #16213f; rotate: -6deg; image-rendering: pixelated;
        animation: band 7s ease-in-out infinite alternate; }
      .boot-band.b1 { top: 22%; }
      .boot-band.b2 { top: 70%; height: 24px; opacity: .6; animation-delay: -3s; }
      @keyframes band { to { translate: 0 18px; } }
      /* « ? » qui tombent, flous et lointains */
      .boot-q { position: absolute; top: -12%; width: 48px; height: 48px; opacity: .14; image-rendering: pixelated; animation: fall 6s linear infinite; }
      .boot-q.q1 { left: 18%; animation-delay: -1s; }
      .boot-q.q2 { left: 72%; width: 64px; height: 64px; animation-duration: 8s; animation-delay: -5s; }
      .boot-q.q3 { left: 45%; width: 32px; height: 32px; opacity: .08; animation-duration: 10s; animation-delay: -2s; }
      @keyframes fall { to { translate: 0 130vh; rotate: 40deg; } }
      .boot-box { position: relative; display: flex; flex-direction: column; align-items: center; gap: 14px; }
      /* le jeton sautille (il s'écrase en touchant le sol) et se balance */
      .boot-coin { width: 112px; height: 112px; image-rendering: pixelated; transform-origin: 50% 100%; animation: hop 1.1s cubic-bezier(.3,0,.5,1) infinite; }
      @keyframes hop {
        0%, 100% { translate: 0 0; scale: 1.08 .92; rotate: 0deg; }
        15% { scale: .96 1.05; }
        50% { translate: 0 -26px; scale: 1 1; rotate: -6deg; }
        80% { translate: 0 -4px; rotate: 3deg; }
      }
      .boot-shadow { width: 76px; height: 10px; margin-top: -12px; background: #000; opacity: .45; border-radius: 50%; animation: shadow 1.1s cubic-bezier(.3,0,.5,1) infinite; }
      @keyframes shadow { 50% { scale: .6 1; opacity: .2; } }
      .boot-logo { height: 54px; width: auto; image-rendering: pixelated; rotate: -2deg; animation: logo 3.2s ease-in-out infinite; }
      @keyframes logo { 50% { translate: 0 -4px; rotate: 1deg; } }
      /* barre en blocs pixel, dans une boîte penchée comme celles du site */
      .boot-bar { display: flex; gap: 4px; padding: 7px; border: 1px solid rgba(255,255,255,.12); border-radius: 8px; background: #1a1a22; rotate: 1deg; }
      .boot-bar i { width: 16px; height: 10px; border-radius: 2px; background: #2a2f45; animation: 1.8s steps(1) infinite; }
      .boot-bar i:nth-child(1) { animation-name: b1; } @keyframes b1 { 0% { background: #2a2f45; } 10% { background: #3d6bff; } 95% { background: #2a2f45; } }
      .boot-bar i:nth-child(2) { animation-name: b2; } @keyframes b2 { 0% { background: #2a2f45; } 20% { background: #3d6bff; } 95% { background: #2a2f45; } }
      .boot-bar i:nth-child(3) { animation-name: b3; } @keyframes b3 { 0% { background: #2a2f45; } 30% { background: #3d6bff; } 95% { background: #2a2f45; } }
      .boot-bar i:nth-child(4) { animation-name: b4; } @keyframes b4 { 0% { background: #2a2f45; } 40% { background: #3d6bff; } 95% { background: #2a2f45; } }
      .boot-bar i:nth-child(5) { animation-name: b5; } @keyframes b5 { 0% { background: #2a2f45; } 50% { background: #3d6bff; } 95% { background: #2a2f45; } }
      .boot-bar i:nth-child(6) { animation-name: b6; } @keyframes b6 { 0% { background: #2a2f45; } 60% { background: #3d6bff; } 95% { background: #2a2f45; } }
      .boot-bar i:nth-child(7) { animation-name: b7; } @keyframes b7 { 0% { background: #2a2f45; } 70% { background: #3d6bff; } 95% { background: #2a2f45; } }
      .boot-bar i:nth-child(8) { animation-name: b8; } @keyframes b8 { 0% { background: #2a2f45; } 80% { background: #3d6bff; } 95% { background: #2a2f45; } }
      @media (prefers-reduced-motion: reduce) { .boot *, .boot { animation: none !important; } .boot-bar i { background: #3d6bff; } }
    </style>
  </head>
  <body>
    <!-- Effet « doodle » : 3 légères déformations (turbulence) qui s'enchaînent pour faire vivre les pixel arts -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
        <filter id="dd0" x="-12%" y="-12%" width="124%" height="124%"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="1" seed="3"/><feDisplacementMap in="SourceGraphic" scale="3" xChannelSelector="R" yChannelSelector="G"/></filter><filter id="ds0" x="-12%" y="-12%" width="124%" height="124%"><feTurbulence type="fractalNoise" baseFrequency="0.07" numOctaves="1" seed="3"/><feDisplacementMap in="SourceGraphic" scale="1.4" xChannelSelector="R" yChannelSelector="G"/></filter>
        <filter id="dd1" x="-12%" y="-12%" width="124%" height="124%"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="1" seed="17"/><feDisplacementMap in="SourceGraphic" scale="3" xChannelSelector="R" yChannelSelector="G"/></filter><filter id="ds1" x="-12%" y="-12%" width="124%" height="124%"><feTurbulence type="fractalNoise" baseFrequency="0.07" numOctaves="1" seed="17"/><feDisplacementMap in="SourceGraphic" scale="1.4" xChannelSelector="R" yChannelSelector="G"/></filter>
        <filter id="dd2" x="-12%" y="-12%" width="124%" height="124%"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="1" seed="41"/><feDisplacementMap in="SourceGraphic" scale="3" xChannelSelector="R" yChannelSelector="G"/></filter><filter id="ds2" x="-12%" y="-12%" width="124%" height="124%"><feTurbulence type="fractalNoise" baseFrequency="0.07" numOctaves="1" seed="41"/><feDisplacementMap in="SourceGraphic" scale="1.4" xChannelSelector="R" yChannelSelector="G"/></filter>
        <!-- mutations : la palette du jeton remplacée par un dégradé (or, nacre, ombre) -->
        <filter id="vgold" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="0.3 0.59 0.11 0 0  0.3 0.59 0.11 0 0  0.3 0.59 0.11 0 0  0 0 0 1 0"/><feComponentTransfer><feFuncR type="table" tableValues="0.22 0.5 0.82 0.98 1"/><feFuncG type="table" tableValues="0.1 0.3 0.58 0.8 0.97"/><feFuncB type="table" tableValues="0.02 0.04 0.1 0.26 0.72"/></feComponentTransfer></filter>
        <filter id="vceleste" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="0.3 0.59 0.11 0 0  0.3 0.59 0.11 0 0  0.3 0.59 0.11 0 0  0 0 0 1 0"/><feComponentTransfer><feFuncR type="table" tableValues="0.32 0.55 0.78 0.94 1"/><feFuncG type="table" tableValues="0.36 0.62 0.86 0.96 1"/><feFuncB type="table" tableValues="0.58 0.86 1 1 1"/></feComponentTransfer></filter>
        <filter id="vombre" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="0.3 0.59 0.11 0 0  0.3 0.59 0.11 0 0  0.3 0.59 0.11 0 0  0 0 0 1 0"/><feComponentTransfer><feFuncR type="table" tableValues="0.04 0.12 0.3 0.58 0.88"/><feFuncG type="table" tableValues="0.02 0.05 0.11 0.32 0.74"/><feFuncB type="table" tableValues="0.08 0.22 0.5 0.88 1"/></feComponentTransfer></filter>
      </defs>
    </svg>
    <div class="boot" id="boot" aria-busy="true" aria-label="Takoras">
      <i class="boot-band b1"></i><i class="boot-band b2"></i>
      <img class="boot-q q1" src="/img/tokens/mystery.png" alt="" /><img class="boot-q q2" src="/img/tokens/mystery.png" alt="" /><img class="boot-q q3" src="/img/tokens/mystery.png" alt="" />
      <div class="boot-box">
        <img class="boot-coin" src="/img/tokens/takoras.png" alt="" width="112" height="112" />
        <i class="boot-shadow"></i>
        <img class="boot-logo" src="/img/logo-takoras.png?v=2" alt="Takoras" height="54" />
        <div class="boot-bar"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
