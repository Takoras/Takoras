<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0d12" />
    <title>Takoras</title>
    <link rel="icon" type="image/png" href="/img/logo.png" />
    <!-- connexion au serveur de jeu ouverte tout de suite (gagne ~100 ms sur la première requête) -->
    <link rel="preconnect" href="https://joyskjoofihwhycyreyn.supabase.co" crossorigin />
    <!-- Écran de chargement (comme l'ancien site) : affiché tout de suite, avant le JS ; React le remplace dès qu'il est prêt -->
    <style>
      html, body { margin: 0; background: #0d0d12; color: #f2f2f5; }
      .boot { position: fixed; inset: 0; display: grid; place-items: center; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
      .boot-box { display: flex; flex-direction: column; align-items: center; gap: 18px; }
      .boot-logo { display: flex; align-items: center; gap: 10px; font-size: 28px; font-weight: 800; letter-spacing: .12em; }
      .boot-logo img { width: 44px; height: 44px; image-rendering: pixelated; }
      .boot-bar { width: 200px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, .08); overflow: hidden; }
      .boot-bar i { display: block; width: 40%; height: 100%; border-radius: 2px; background: #7c3aed; animation: boot 1.1s ease-in-out infinite; }
      @keyframes boot { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { .boot-bar i { animation: none; width: 100%; opacity: .6; } }
    </style>
  </head>
  <body>
    <!-- Effet « doodle » : 3 légères déformations (turbulence) qui s'enchaînent pour faire vivre les pixel arts -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
        <filter id="dd0" x="-6%" y="-6%" width="112%" height="112%"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2" xChannelSelector="R" yChannelSelector="G"/></filter>
        <filter id="dd1" x="-6%" y="-6%" width="112%" height="112%"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="17"/><feDisplacementMap in="SourceGraphic" scale="2" xChannelSelector="R" yChannelSelector="G"/></filter>
        <filter id="dd2" x="-6%" y="-6%" width="112%" height="112%"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="41"/><feDisplacementMap in="SourceGraphic" scale="2" xChannelSelector="R" yChannelSelector="G"/></filter>
      </defs>
    </svg>
    <div id="root">
      <div class="boot" aria-busy="true" aria-label="Takoras">
        <div class="boot-box">
          <div class="boot-logo"><img src="/img/logo.png" alt="" width="44" height="44" />TAKORAS</div>
          <div class="boot-bar"><i></i></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
