<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Takoras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="nav">
    <div class="wrap nav-in">
      <a class="logo" href="/"><span>T</span>TAKORAS</a>
      <div class="links">
        <a class="on" href="#">Pull</a>
        <a href="#">Collection</a>
        <a href="#classement">Classement</a>
        <a href="#">Boutique</a>
      </div>
      <div class="bal"><i class="mini-coin"></i><b>12 450</b></div>
    </div>
  </nav>

  <main>
    <section class="wrap stage">
      <aside class="panel types">
        <div class="panel-head"><b>Pulls</b></div>
        <div id="types"></div>
      </aside>

      <div class="center">
        <div class="orbit"></div>
        <div class="glow" id="glow"></div>
        <div class="float f1"></div><div class="float f2"></div><div class="float f3"></div><div class="float f4"></div>
        <div class="hero-coin" id="coin"><span>T</span></div>
        <div class="eyebrow" id="tag">Permanent</div>
        <h1 id="name">Pull Takoras</h1>
        <p class="timer" id="timer"></p>
        <div class="actions">
          <button class="btn primary">Pull ×1 · <span id="p1">100</span> ◆</button>
          <button class="btn ghost">Pull ×10 · <span id="p10">900</span> ◆</button>
        </div>
      </div>

      <aside class="panel">
        <div class="panel-head"><b>Mon historique</b><a href="#">Tout voir</a></div>
        <div id="hist"></div>
      </aside>
    </section>

    <section class="wrap live">
      <div class="live-head"><span class="dot"></span><b>En direct</b></div>
      <div class="ticker"><div class="track" id="live"></div></div>
    </section>

    <section class="wrap board" id="classement">
      <div class="board-head">
        <div>
          <div class="eyebrow">Classement</div>
          <h2>Les meilleurs joueurs</h2>
        </div>
        <div class="seg" id="period">
          <button class="on" data-p="week">Cette semaine</button>
          <button data-p="all">Depuis toujours</button>
        </div>
      </div>
      <div class="chips" id="kinds"></div>
      <div class="podium" id="podium"></div>
      <div class="list" id="list"></div>
    </section>
  </main>

  <footer class="wrap foot">© 2026 Takoras</footer>

  <script src="app.js"></script>
</body>
</html>
