<!doctype html><html lang="fr"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;background:#1d3fbf;font-family:Archivo,sans-serif;display:flex;align-items:center;justify-content:center}
.book{width:1280px;height:760px;display:flex;box-shadow:0 30px 60px rgba(0,0,0,.4)}
.pg{flex:1;background:#f6f3ea;padding:56px;position:relative}
.pg:first-child{border-right:2px solid #d9d2bf}
h1{font-family:'Archivo Black';font-size:76px;line-height:.95;color:#14204d;margin:20px 0}
.k{color:#d4232f;font-size:16px;letter-spacing:.18em;text-transform:uppercase}
p{font-size:21px;color:#3a3f55;line-height:1.45;max-width:460px}
.btn{display:inline-flex;margin-top:34px;height:68px;padding:0 40px;align-items:center;background:#d4232f;color:#fff;font-family:'Archivo Black';font-size:24px;border-radius:6px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:10px}
.s{aspect-ratio:1;border:2px dashed #c7bfa8;border-radius:8px;display:flex;align-items:flex-end;justify-content:center;font-family:'Archivo Black';color:#c7bfa8;font-size:20px;padding-bottom:8px}
.s.f{border:none;background:radial-gradient(circle at 50% 42%,#a78bfa 0 34%,#fff 35%);box-shadow:0 4px 0 #d9d2bf;color:#14204d}
</style></head><body><div class="book">
<div class="pg"><div class="k">Série Takoras · album 1</div><h1>Ouvre des jetons. Gagne des duels.</h1><p>17 jetons à coller. Chaque boîte en remplit une case. Les doublons montent de niveau.</p><div class="btn">Jouer</div></div>
<div class="pg"><div class="grid">
<div class="s f">01</div><div class="s f">02</div><div class="s">03</div><div class="s f">04</div>
<div class="s">05</div><div class="s">06</div><div class="s f">07</div><div class="s">08</div>
<div class="s">09</div><div class="s f">10</div><div class="s">11</div><div class="s">12</div></div></div>
</div></body></html>
